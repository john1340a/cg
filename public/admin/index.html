<!DOCTYPE html>

<head>

    <title>Administration — Modération</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">

<body>

        <a href="/" class="marque"><span class="msi" aria-hidden="true">diamond</span> Administration</a>

                    <option value="rejete">Rejetées</option>

                </select>
            </div>
            <div id="liste-moderation" class="espace">
                <p class="muet">Chargement…</p>
            </div>
        </div>

    <script src="/assets/js/api.js"></script>
