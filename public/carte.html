<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Carte des bourses aux minéraux</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/assets/vendor/maplibre-gl.css">
    <link rel="stylesheet" href="/assets/css/fonts.css">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/assets/css/carte.css">
</head>
<body class="page-carte">
    <header class="entete">
        <a href="/" class="marque">◆ Bourses aux Minéraux</a>
        <nav>
            <a href="/compte/">Espace organisateur</a>
        </nav>
    </header>

    <div class="carte-layout">
        <!-- Panneau latéral : filtres + liste -->
        <aside class="panneau" id="panneau">
            <button class="btn secondaire petit bascule-panneau" id="bascule-panneau"
                    aria-expanded="true">Filtres ▾</button>

            <div class="panneau-contenu" id="panneau-contenu">
                <h2>Filtres</h2>
                <div class="champ">
                    <label for="f-mois">Mois</label>
                    <select id="f-mois">
                        <option value="">Tous les mois</option>
                    </select>
                </div>
                <div class="ligne-2">
                    <div class="champ">
                        <label for="f-debut">À partir du</label>
                        <input type="date" id="f-debut">
                    </div>
                    <div class="champ">
                        <label for="f-fin">Jusqu'au</label>
                        <input type="date" id="f-fin">
                    </div>
                </div>
                <div class="champ">
                    <label for="f-categorie">Catégorie</label>
                    <select id="f-categorie">
                        <option value="">Toutes</option>
                        <option value="mineraux">Minéraux</option>
                        <option value="fossiles">Fossiles</option>
                        <option value="gemmes">Gemmes / bijoux</option>
                        <option value="esoterisme">Ésotérisme / lithothérapie</option>
                    </select>
                </div>
                <div class="champ">
                    <label for="f-type">Type</label>
                    <select id="f-type">
                        <option value="">Tous</option>
                        <option value="echanges">Bourse d'échanges</option>
                        <option value="vente">Bourse de vente</option>
                    </select>
                </div>
                <div class="champ case">
                    <input type="checkbox" id="f-passes">
                    <label for="f-passes" style="margin:0;">Afficher aussi les événements passés</label>
                </div>
                <button class="btn secondaire petit" id="btn-reset">Réinitialiser</button>

                <hr>
                <h2>Événements <span id="compteur" class="muet"></span></h2>
                <div id="liste-events" class="liste-events">
                    <p class="muet">Chargement…</p>
                </div>
            </div>
        </aside>

        <!-- Carte -->
        <div class="carte-zone">
            <div id="carte"></div>
            <!-- Légende (couleur par mois) -->
            <div class="legende" id="legende" aria-label="Légende des mois"></div>
            <!-- Sélecteur de fond -->
            <div class="selecteur-fond">
                <label for="fond">Fond :</label>
                <select id="fond">
                    <option value="osm">Plan (OSM)</option>
                    <option value="clair">Clair</option>
                    <option value="satellite">Satellite</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Modale d'agrandissement de l'affiche -->
    <div class="modale-affiche masque" id="modale-affiche">
        <div class="modale-fond" id="modale-fond"></div>
        <img id="modale-img" alt="Affiche de l'événement">
    </div>

    <script src="/assets/vendor/maplibre-gl.js"></script>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/carte.js"></script>
    <script>
        // Initialisation de la carte publique complète (avec chrome).
        document.addEventListener('DOMContentLoaded', () => initCarte({ embed: false }));
    </script>
</body>
</html>
